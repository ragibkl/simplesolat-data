name: Verify zones

# Location → zone checks (tests/zone-points/*.yaml) whenever a map, mapping
# or zone list changes.
on:
  pull_request:
    paths:
      - 'data/geojson/**'
      - 'data/mappings/**'
      - 'data/zones/**'
      - 'data/countries.yaml'
      - 'tests/zone-points/**'
      - 'scripts/verify_data.py'
  push:
    branches: [main]
    paths:
      - 'data/geojson/**'
      - 'data/mappings/**'
      - 'data/zones/**'
      - 'data/countries.yaml'
      - 'tests/zone-points/**'
  workflow_dispatch:

jobs:
  zones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 scripts/verify_data.py zones
