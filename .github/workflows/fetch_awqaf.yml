name: Fetch AWQAF (AE)

on:
  schedule:
    - cron: '0 3 27 * *'
    - cron: '0 3 28 * *'
    # Weekly (Mondays) Nov–Jan, while next year's timetables trickle in
    - cron: '0 3 * 11,12,1 1'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright pyyaml
          playwright install chromium

      - name: Fetch prayer times
        run: |
          Y=$(date +%Y)
          python3 scripts/fetch_awqaf.py $Y
          python3 scripts/fetch_awqaf.py $((Y + 1)) || echo "AE $((Y + 1)) not available yet"

      - name: Verify next month data
        run: python3 scripts/verify_data.py next-month AE

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prayer-times/AE/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fetch AWQAF prayer times (automated)"
            git pull --rebase
            git push
          fi
