name: Fetch Diyanet (TR)

on:
  schedule:
    - cron: '0 3 27 * *'
    - cron: '0 3 28 * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      # This year and next (Diyanet publishes next year before January);
      # Albania comes from the same Diyanet database.
      - name: Fetch prayer times
        run: |
          Y=$(date +%Y)
          for cc in TR AL; do
            python3 scripts/fetch_diyanet.py $Y $cc
            python3 scripts/fetch_diyanet.py $((Y + 1)) $cc || echo "$cc $((Y + 1)) not available yet"
          done

      - name: Verify next month data
        run: python3 scripts/verify_data.py next-month TR AL

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prayer-times/TR/ data/prayer-times/AL/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fetch Diyanet prayer times (automated)"
            git pull --rebase
            git push
          fi
