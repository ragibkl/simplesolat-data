# Before 2027 each district takes the times of the JAKIM zone it was part of
# (the mufti's own 2026 tables ZON 1-3 match JAKIM's SGR01-03; checked
# 2026-11-12: 3 differences of 1 minute in 7,665 times).
legacy:
  "2026":
    MFSGR01: SGR01
    MFSGR02: SGR01
    MFSGR03: SGR01
    MFSGR04: SGR01
    MFSGR05: SGR01
