# Jabatan Mufti Negeri Selangor: prayer timetables per district.
# Source page: https://www.muftiselangor.gov.my/takwim-solat/
# From 2027 the mufti publishes one timetable per district (9 districts)
# instead of three zones. JAKIM's e-Solat has no 2027 data for Selangor yet,
# so these zones (MFSGR01-09) come straight from the issuing authority.
# Zone order follows the order of the takwim page.
pdfs:
